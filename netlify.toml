# Portal Futuro · configuração do Netlify
# Publica a pasta do projeto como está (site estático, sem etapa de build).
[build]
  publish = "."

# Cabeçalhos de segurança enviados em todas as páginas
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; media-src 'self' https://d8j0ntlcm91z4.cloudfront.net; connect-src https://baubfjqwrdyeqarmjjio.supabase.co; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; object-src 'none'"

# Os arquivos internos do projeto não precisam ser públicos
[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/.gitignore"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/_headers"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true
